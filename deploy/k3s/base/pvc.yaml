apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: new-api-data
  namespace: new-api
spec:
  accessModes:
    - ReadWriteOnce
  # k3s mặc định có StorageClass local-path.
  # Nếu cluster dùng storage class khác, sửa hoặc bỏ dòng này.
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
