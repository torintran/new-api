apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: new-api
resources:
  - ../../base
# Image GHCR của fork. Tag latest là tag di động; deployment dùng
# imagePullPolicy Always để node kéo lại. Khi đã có tag bất biến, đổi newTag.
images:
  - name: ghcr.io/torintran/new-api
    newTag: latest
